    <symbol id="icone-communaute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />

      <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    </symbol>
    <symbol id="icone-cadeau" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="8" width="18" height="4" />
      <path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" />
      <path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8" />
      <path d="M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8" />

    <symbol id="icone-personne" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    </symbol>
    <symbol id="icone-soleil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />

    <symbol id="icone-fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </symbol>
    <symbol id="icone-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 6h18M3 12h18M3 18h18" />
    </symbol>
  </svg>

  <header class="site-header">
    <a href="../index.html" class="site-header__logo">
      <img src="../images/logoC2P.png" alt="Logo Premiers Pas" />
    </a>
    <input type="checkbox" id="menu-toggle" class="menu-toggle-checkbox" />
    <label for="menu-toggle" class="menu-toggle-bouton" aria-label="Ouvrir le menu">
      <svg class="icone">
        <use href="#icone-menu"></use>

    <nav class="pill-nav" aria-label="Navigation principale">

      <a href="./rejoindre.html" class="pill-nav__item">

        Rejoindre
      </a>
    </nav>
    <button class="theme-toggle" aria-label="Basculer le thème clair/sombre">
      <svg class="icone">
        <use href="#icone-soleil"></use>
      </svg>
    </button>
  </header>

    <main class="page-rejoindre">
    <section class="formulaire-inscription">
      <div class="formulaire-inscription__en-tete">
        <h1>Rejoindre C2P</h1>
        <p>Inscrivez-vous pour faire vos premiers pas en informatique avec nous.</p>
      </div>

      <form class="formulaire-inscription__contenu" action="#" method="POST">
        <div class="formulaire-inscription__champ">
          <label for="nom">Nom &amp; Prénoms</label>
          <input type="text" id="nom" name="nom" placeholder="Gramiz" required />
        </div>

        <div class="formulaire-inscription__champ">
          <label for="email">Adresse E-mail</label>
          <input type="email" id="email" name="email" placeholder="exemple@mail.com" required />
        </div>

        <div class="formulaire-inscription__champ">
          <label for="niveau">Niveau actuel</label>
          <select id="niveau" name="niveau">
            <option value="debutant">Débutant complet</option>
            <option value="intermediaire">Notions de base</option>
            <option value="avance">Avancé</option>
          </select>
        </div>

        <div class="formulaire-inscription__champ">
          <label for="motivations">Pourquoi souhaitez-vous rejoindre C2P ?</label>
          <textarea id="motivations" name="motivations" rows="4" placeholder="Décrivez vos objectifs..."></textarea>
        </div>

        <button type="submit" class="formulaire-inscription__bouton">
          Envoyer ma demande
          <svg class="icone">
            <use href="#icone-fleche"></use>
          </svg>
        </button>
      </form>
    </section>
  </main>
